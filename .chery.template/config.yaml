# 9. 附录
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ▍ 9.1 设置面板 → 字段速查（完整对照见 docs/utils/config.md）
#   ⚙ 全局        GlobalTab.vue          web/src/features/agent/settings/tabs/
#   🧠 AI 大脑     BrainsTab.vue          （BrainsTab + BrainCard + MediaCapabilityGrid）
#   👂 感官分组    SensesTab.vue
#   🎭 角色        RolesTab.vue
#   📦 预设        PresetsTab.vue
#   🔌 MCP 服务    McpTab.vue
#   🖼 媒体服务    MediaTab.vue
#   ⚙ 服务（server）不在设置面板！手编 yaml + 重启生效
#
# ▍ 9.2 字段默认值兜底（运行时硬编码，src/utils/config.ts）
#   server.port                 = 8182
#   server.transport            = "binary"（仅当显式 "json" 时才取）
#   server.host                 = "127.0.0.1"
#   global.skills_dir           = <chery_dir>/.chery/skills
#   global.senses_dir           = <chery_dir>/.chery/senses
#   global.system_prompt        = <chery_dir>/.chery/system.md
#   global.prompts_dir          = <chery_dir>/.chery/prompts
#   global.db_dir               = $DB_DIR || <chery_dir>/.chery/db
#   global.sense_execute_timeout = 30000ms（business.ts:10）
#   media.*.maxUploadMb         = 100  MB（media/index.ts:40）
#   brain.contextLimit           = 8192 token（token.ts:17）
#   capabilities.toolCall        = true（缺省）
#   roles.*.mcpServers          = []
#   mock.enabled                = true
#   file_compression.truncate_threshold     = 150000
#   file_compression.truncate_preview_lines = 100
#   file_compression.drain_preview_count    = 3
#   log_file_extensions 默认         = ["log", "txt", "out", "err"]（按扩展名）
#
# ▍ 9.3 字段交叉校验（validateRawConfig @ src/utils/config.ts:422-549）
#   1. global.supervision ∈ {auto, confirm, manual}
#   2. mcp_servers.*.supervision ∈ {auto, confirm, manual}（可选）
#   3. sense_groups.*[i] 后缀 ∈ {auto, confirm, manual}
#   4. llm.brain.* 非空；每条 model/provider 必填
#   5. llm.brain.*.capabilities.generate.* 任一为 true ⇒ toolCall ≠ false
#   6. llm.brain.*.key / media.*.key 必须 ∈ /^\$[A-Z_][A-Z0-9_]*$/
#   7. media.*.type ∈ {image, video, audio}
#   8. media.*.enabled=true ⇒ url 必须存在
#   9. roles.*.brain ∈ llm.brain.* 键集合
#  10. roles.*.brain.toolCall=false ⇒ 禁止 senseGroup / mcpServers
#  11. roles.*.systemPrompt 文件必须存在（绝对路径或相对 .chery）
#  12. presets.*.leader 必填 + ∈ roles.* 键 + ∈ 自己 roles 列表
#  13. presets.*.roles[*] 全 ∈ roles.* 键
#  14. presets.*.mediaImage/Video/Audio 引用 ∈ media.* 且 type 匹配
#
# ▍ 9.4 UI 不暴露 / 需手编 yaml 的字段清单
#   ┌─────────────────────────────────┬───────────────────────────────┐
#   │ 字段                            │ 原因                          │
#   ├─────────────────────────────────┼───────────────────────────────┤
#   │ server.port / transport / host  │ schema .strict() 拒收          │
#   │ server.auth.*                   │ 同上                           │
#   │ llm.brain.*.mock.{enabled,file} │ BrainCard.vue 不渲染           │
#   │ mcp_servers.*.env               │ McpTab.vue 不渲染              │
#   │ global.logger 对象本身          │ GlobalTab.vue v-if 存在性       │
#   │ global.file_compression 对象本身│ GlobalTab.vue v-if 存在性       │
#   │ roles.*.systemPrompt 绝对路径    │ cascader 只对 prompts/ 建树    │
#   └─────────────────────────────────┴───────────────────────────────┘
#
# ▍ 9.5 写入流程（端到端）
#   设置面板编辑 → config.save RPC → handler.handleConfigSave
#                 → saveRawConfig (src/utils/config.ts:570)
#                 → validateRawConfig (config.ts:422)【失败 INVALID_PARAMS + 错误明细】
#                 → 合并 server 段从盘读回保留
#                 → yaml.dump → 写盘
#                 → 返 { needRestart: true }
#   ⚠️ 后端运行时内存单例不更新，必须重启；mcp.reload 单独热更 mcp_servers。
#
# ▍ 9.6 主数据流参考
#   chat.send → RPC router → AgentBuilder.run → Middleware 链（checkpoint→sense→retry→chat）
#   → LLM 流式 → service observer（DB 持久化 + 审批注册）→ WebSocket 推送
