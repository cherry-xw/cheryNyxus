# 首次启动只需在「设置 → 大脑」中配置 default；完整字段见 docs/config.md。
global:
  thinking: true
  supervision: manual
  stream: true
  sense_execute_timeout: 10000
  approval_timeout: 300000
  approval_hard_timeout: 1800000
  disconnect_grace_ms: 15000
  history_recall:
    max_output_chars: 4000
  watchdog:
    timeout_ms: 300000
    wake_on_timeout: false
  bash_log_retention_hours: 24
  textEditor: notepad
  file_compression:
    truncate_threshold: 50000
    truncate_preview_lines: 100
    log_file_extensions:
      - .log
      - .txt
      - .out
      - .err
    drain_preview_count: 3
  logger:
    level: info
    output:
      - file
    timestamp: true
    location: true
    format: plain
llm:
  brain:
    default:
      url: <YOUR_LLM_URL>
      model: <YOUR_MODEL_NAME>
      key: $LLM_API_KEY
      provider: openai
      protocol: openai-chat-completions
media: {}
sense_groups:
  chery_nexus:
    - read_file
    - skill
    - write_file
    - execute_command
    - search_codebase
    - spawn_role
    - ask_user_question
    - history_recall
    - install_skill
    - config_manage
    - role_acceptance
  detail_diagnostics:
    - read_file
    - search_codebase
    - execute_command
  curator:
    - memory_manage
    - read_file
    - search_codebase
    - ask_user_question
  conversation_routing:
    - select_conversation:auto
  role_architect:
    - skill
    - read_file
    - search_codebase
    - ask_user_question
  role_acceptance:
    - skill
roles:
  cheryNyxus:
    brain: default
    avatar: 🐈‍⬛
    description: Chery Nyxus：系统配置管理核心角色（管理所有角色配置）+ 桌宠组长
    senseGroup: chery_nexus
    mcpServers: []
    systemPrompt: prompt/cheryNyxus/cheryNyxus.md
    lock: true
    id: role-c93be74de4d4aba9
  curator:
    brain: default
    description: 记忆维护：每轮提取记忆、定期整理（Extract/Dream）
    mentionable: true
    senseGroup: curator
    mcpServers: []
    systemPrompt: prompt/curator/curator.md
    lock: true
    id: role-253976855f08111c
  explanation:
    brain: default
    description: 只解释所选节点的概念与因果，不执行项目任务
    mentionable: false
    senseGroup: detail_diagnostics
    mcpServers: []
    id: role-f78fcae67d4aa998
  conversation_router:
    kind: shadow
    brain: default
    description: 在发送后选择应继续的历史会话或新建会话，不进入节点树
    senseGroup: conversation_routing
    mcpServers: []
    id: role-4dd18552fe5839d7
  roleArchitect:
    avatar: 🧩
    brain: default
    description: 角色架构师：研究任意岗位并输出职责、风险、能力诉求与验收蓝图；不修改配置
    id: role-rolearchitect0001
    mentionable: false
    senseGroup: role_architect
    mcpServers: []
    systemPrompt: prompt/roleArchitect/roleArchitect.md
    skills:
      - role-design
  roleAcceptance:
    avatar: 🧪
    brain: default
    description: 独立角色验收器：只依据隔离执行证据判定，不修改配置或执行目标任务
    id: role-roleacceptance001
    mentionable: false
    senseGroup: role_acceptance
    mcpServers: []
    systemPrompt: prompt/roleAcceptance/roleAcceptance.md
    skills:
      - role-acceptance
    permissions:
      template: read-only
presets:
  cheryNyxus:
    id: preset-c93be74de4d4aba9
    shadows:
      conversationRouting: conversation_router
    detailRole: explanation
    leader: cheryNyxus
    roles:
      - cheryNyxus
      - roleArchitect
      - roleAcceptance
      - curator
      - explanation
memory:
  global:
    max_count: 30
    max_chars: 500
  workspace:
    max_count: 15
    max_chars: 500
server:
  port: 8182
  webPort: 8183
  transport: binary
  host: 127.0.0.1
  serve_frontend: true
