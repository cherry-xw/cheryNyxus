# 模型 → 思考强度档位映射
#
# 档位选择规则（最小化）：
#  - 支持 reasoning_effort 全档的推理模型：只列 [off, low, medium, high]
#    （不列 on——已提供显式强度档位时，"由模型决定"无独立语义）
#  - 仅支持开关的模型（无强度概念）：列 [off, on]
#  - 未配置 / 未命中：后端兜底返回 ["off", "on"]
#
# 匹配顺序：精确 > 最长前缀 > 通配 "*"。
# 每条 aliases 含若干模型名（含通配 "*" 表示兜底命中所有未匹配项）。
#
# ThinkingLevel 枚举（src/core/llm/adapter.ts）：
#   - off：关闭（provider 省略思考参数）
#   - on：仅用于开关模型，对应"由服务端决定"或"未传 reasoning_effort"
#   - low / medium / high：强度递增（OpenAI 兼容端点 → reasoning_effort）

models:
  # 智谱 GLM 系列（OpenAI 兼容协议，reasoning_effort 全 4 档）
  - aliases: [glm-5.2, glm-5, glm-4.6, glm-4-plus, glm-4]
    thinking: [off, low, medium, high]

  # LongCat-Flash-Thinking 系列（专属思考模型，仅开关两档）
  - aliases: [LongCat-Flash-Thinking, LongCat-Flash-Thinking-2601]
    thinking: [off, on]

  # 豆包 doubao 系列
  - aliases: [doubao2.0-pro, doubao-pro, doubao-lite]
    thinking: [off, low, medium, high]

  # DeepSeek 系列
  - aliases: [deepseek-r1, deepseek-reasoner, deepseek-v3]
    thinking: [off, low, medium, high]

  # OpenAI o1 系列
  - aliases: [o1, o1-mini, o1-preview, o3, o3-mini, o4-mini]
    thinking: [off, low, medium, high]

  # Anthropic Claude 系列（adaptive thinking + output_config.effort 四档）
  # 详见 docs/agent/provider.md「anthropic provider」
  - aliases:
      - claude-fable-5
      - claude-mythos-5
      - claude-opus-4-8
      - claude-opus-4-7
      - claude-opus-4-6
      - claude-opus-4-5
      - claude-opus-4-1
      - claude-opus-4-0
      - claude-sonnet-5
      - claude-sonnet-4-6
      - claude-sonnet-4-5
      - claude-sonnet-4-0
      - claude-haiku-4-5
    thinking: [off, on, low, medium, high]  # 'on' 走 adaptive 自适应，low/medium/high 走 effort

  # 通配兜底：未列出的模型默认仅暴露开关两档
  - aliases: ["*"]
    thinking: [off, on]
