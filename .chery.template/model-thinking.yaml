# 模型 → 思考强度档位映射
#
# thinking 字段：数组——**原样返回文件中的单词**，按 YAML 顺序，不校验、不剔除、不映射。
# `on`/`off` 是仅有的「开关档关键词」，但任何字符串都可作档位名（如 DeepSeek 的 `max`）。
# 例：
#   [off, on]                    → [off, on]
#   [off, low, medium, high]     → [off, low, medium, high]
#   [off, on, high, max]         → [off, on, high, max]（`max` 原样显示；DeepSeek provider 内部映射为 'max'）
#
# 匹配顺序：精确 > 最长前缀 > 通配 "*"。
# aliases 含若干模型名（含通配 "*" 表示兜底命中所有未匹配项）。
# 未配置 / 未命中：兜底 ["off", "on"]。

models:
  # 智谱 GLM 系列（OpenAI 兼容协议，reasoning_effort 全 4 档）
  - aliases: [glm-5.2, glm-5, glm-4.6, glm-4.6, glm-4-plus, glm-4]
    thinking: [off, low, medium, high]
  - aliases: [glm-5.3]
    thinking: [low, medium, high]

  # LongCat-Flash-Thinking 系列（专属思考模型，仅开关两档）
  - aliases: [LongCat-Flash-Thinking, LongCat-Flash-Thinking-2601]
    thinking: [off, on]

  # 豆包 doubao 系列
  - aliases: [doubao2.0-pro, doubao-pro, doubao-lite]
    thinking: [off, low, medium, high]

  # DeepSeek 系列
  - aliases: [deepseek-v4-pro, deepseek-v4-flash]
    thinking: [off, on, high, max]

  # OpenAI o1 系列
  - aliases: [o1, o1-mini, o1-preview, o3, o3-mini, o4-mini]
    thinking: [off, low, medium, high]

  # Anthropic Claude 系列（adaptive thinking + output_config.effort 四档）
  # 详见 docs/agent/provider.md「anthropic provider」
  - aliases:
      - claude-fable-5
      - claude-mythos-5
      - claude-opus-4-8
      - claude-opus-4-7
      - claude-opus-4-6
      - claude-opus-4-5
      - claude-opus-4-1
      - claude-opus-4-0
      - claude-sonnet-5
      - claude-sonnet-4-6
      - claude-sonnet-4-5
      - claude-sonnet-4-0
      - claude-haiku-4-5
    thinking: [off, on, low, medium, high]  # 'on' 走 adaptive 自适应，low/medium/high 走 effort

  # 通配兜底：未列出的模型默认仅暴露开关两档
  - aliases: ["*"]
    thinking: [off, on]
