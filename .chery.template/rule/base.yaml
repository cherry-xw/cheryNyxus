# 审批规则：系统默认基准规则（.chery/rule/base.yaml）
#
# 这个文件回答一个问题：哪些操作在用户确认后才能执行？
# 系统在「智能审批（smart）」档下，对每个待执行操作按本表判定：
#   - 命中下表危险模式（如 rm -rf、格式化磁盘）→ 拦截，请用户确认
#   - 未命中 / 未登记 → 放行，自动执行
#   - false → 该操作整体需确认（硬开关，破坏性操作兜底）
# 手动（manual）档一律确认；自动（auto）档不经本表。
#
# ⚠ 黑名单模式（fail-open）风险：只登记危险项，漏配即静默放行。
#   新增破坏性操作必须在此显式标 false，否则会被自动执行；请勿依赖穷举。
#   高敏环境请改用手动（manual）档。
#
# 预设如何用：前端「预设 → 审批规则」下拉选择覆盖文件（.chery/rule/ 下非本基准的
#   其他 yaml），保存后与本基准深合并——
#   - 覆盖文件未提及的操作 → 用本基准条目
#   - 覆盖文件给 false → 整体需确认（硬开关）
#   - 覆盖文件给对象 + inherit 缺省/true → 取覆盖的 extract，dangerPatterns 追加去重
#   - 覆盖文件给对象 + inherit: false → 纯用覆盖，丢弃基准同名条目
# 本基准不可在预设中直接选择（rules.list 已排除）。
# 详见 docs/core/sense.md「smart 规则表」。

# ── 命令类：高危不可逆命令黑名单（命中 = 需确认；未命中 = 自动执行）──
# 黑名单不可穷举，此处仅覆盖高危不可逆；漏配即放行。常用只读命令（git status/ls/cat 等）默认自动执行。
execute_command:
  extract: command                   # 从 args.command 取待匹配串（支持点号路径如 input.path）
  dangerPatterns:
    - 'rm -rf'                       # 子串匹配
    - 'rm -fr'
    - '/\brm\s+-[a-z]*r/'            # 正则：rm 带 -r（覆盖 -rvf 等），约定 /pattern/flags
    - '/\brm\s+-[a-z]*f/'            # rm 带 -f
    - 'dd '                          # 磁盘写
    - 'mkfs'                         # 格式化
    - 'shred'                        # 安全擦除
    - ':(){'                         # fork bomb
    - '/>\s*\/dev\/(sd|nvme|vd|disk)/' # 写块设备
    - 'shutdown'
    - 'reboot'
    - 'poweroff'
    - 'git push --force'             # 强推覆盖远程
    - 'git push -f'
    - 'git reset --hard'             # 丢未提交改动
    - 'git clean -fd'                # 删未跟踪文件
    - '/curl[^|;&]*\|\s*(sh|bash)/'  # curl 管道执行远程脚本
    - '/wget[^|;&]*\|\s*(sh|bash)/'

# ── 文件读取：敏感路径黑名单（命中 = 需确认；其余放行）──
read_file:
  extract: path
  dangerPatterns:
    - '/\.ssh/'                      # 私钥目录
    - 'id_rsa'
    - 'id_ed25519'
    - '/\.env'                       # 凭据文件
    - '/\.aws/credentials'
    - '/\.git-credentials'
    - '/etc/shadow'

# ── 代码搜索：敏感词黑名单（命中 = 需确认；其余放行）──
# 探测凭据/密钥类查询 → 需确认；正常代码搜索 → 自动执行。
search_codebase:
  extract: query
  dangerPatterns:
    - 'password'
    - 'secret'
    - 'api_key'
    - 'apikey'
    - 'access_token'
    - 'private_key'

# ── 无害操作：不登记 → 默认放行（fail-open）──
# ask_user_question：sense 内置 auto（src/agent/sense/ask.ts），根本不进此表。
#   旧白名单版曾配 /^/ 表达全 safe；黑名单下 dangerPatterns 的 /^/ 会倒置成全 danger（荒谬），故删除条目。
# update_todo：todos 为数组、extract 取不到 string；操作无损，不登记 = 放行。
# history_recall：只读历史检索，sense 内置 auto（src/agent/sense/historyRecall.ts），不进此表。

# ── 破坏性 / 资源消耗 / 外部副作用：硬开关 false（无条件需确认）──
write_file: false
spawn_role: false
memory_manage: false
skill: false
install_skill: false
generate_image: false
generate_video: false
generate_audio: false
