<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheryClaw WebSocket Tester</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#1a1a2e;--surface:#16213e;--border:#0f3460;--accent:#e94560;--text:#eee;--dim:#bbb;--think:#b388ff;--content:#81c784;--sense:#ffb74d;--error:#f44336}
body{font-family:'SF Mono',Consolas,'Courier New',monospace;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
/* top bar */
.top{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center;flex-shrink:0}
.top input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:13px;font-family:inherit}
.top input[type=text]{flex:1}
.top button{padding:4px 12px;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit}
.top button:hover{border-color:var(--accent)}
.top .connected{color:var(--content)}
.top .disconnected{color:var(--error)}
#status{font-size:12px;min-width:100px;text-align:center}
/* main layout */
.main{display:flex;flex:1;overflow:hidden}
/* left panel */
.left{width:240px;background:var(--surface);border-right:1px solid var(--border);padding:8px;overflow-y:auto;flex-shrink:0}
.left h3{font-size:12px;color:var(--dim);margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px}
.left h3:first-child{margin-top:0}
.left button{width:100%;margin-bottom:4px;padding:4px 8px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;cursor:pointer;font-size:12px;text-align:left;font-family:inherit}
.left button:hover{border-color:var(--accent)}
.left select,.left input{width:100%;margin-bottom:4px;padding:3px 6px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:12px;font-family:inherit}
.left select[multiple]{min-height:90px}
.left .section{margin-bottom:12px}
.left .hint{font-size:10px;color:var(--dim);margin-bottom:4px}
/* center chat */
.center{flex:1;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:12px}
.msg{margin-bottom:12px;font-size:13px;line-height:1.5}
.msg-user{color:#64b5f6}
.msg-user::before{content:"You: ";font-weight:bold}
.msg-thinking{color:var(--think);border-left:2px solid var(--think);padding-left:8px;margin:4px 0}
.msg-thinking .body{white-space:pre-wrap;max-height:400px;overflow-y:auto}
.msg-thinking summary{cursor:pointer;font-weight:bold;font-size:12px;list-style:none}
.msg-thinking summary::before{content:"▶ "}
.msg-thinking[open] summary::before{content:"▼ "}
.msg-content{color:var(--content);white-space:pre-wrap;max-height:500px;overflow-y:auto}
.msg-content::before{content:"AI: ";font-weight:bold}
.msg-sense{color:var(--sense);border:1px solid var(--sense);border-radius:4px;padding:6px 8px;margin:4px 0;font-size:12px}
.msg-sense .name{font-weight:bold}
.msg-sense .args{background:var(--bg);padding:4px;margin:4px 0;border-radius:2px;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow-y:auto}
.msg-sense .result{color:var(--content);background:var(--bg);padding:4px;border-radius:2px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto}
.msg-done{color:var(--dim);font-style:italic;font-size:12px}
.msg-error{color:var(--error);font-weight:bold}
.msg-loaded{color:var(--dim);font-style:italic;font-size:12px}
/* approval modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:16px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{color:var(--accent);margin-bottom:8px}
.modal .info{font-size:12px;margin-bottom:8px}
.modal .info span{color:var(--dim)}
.modal .args-preview{background:var(--bg);padding:8px;border-radius:4px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin-bottom:12px;max-height:200px;overflow-y:auto}
.modal textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:4px;padding:4px;font-size:12px;font-family:inherit;resize:vertical;margin-bottom:8px}
.modal .actions{display:flex;gap:8px}
.modal .actions button{flex:1;padding:6px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px;border:1px solid var(--border)}
.modal .btn-accept{background:#1b5e20;color:#fff}
.modal .btn-reject{background:#b71c1c;color:#fff}
/* input bar */
.input-bar{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.input-bar input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:13px;font-family:inherit}
.input-bar input:focus{outline:none;border-color:var(--accent)}
.input-bar button{padding:6px 16px;background:var(--accent);border:none;color:#fff;border-radius:4px;cursor:pointer;font-weight:bold;font-family:inherit}
.input-bar button:hover{opacity:0.9}
/* right log */
.right{width:300px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.right h3{font-size:12px;color:var(--dim);padding:8px;border-bottom:1px solid var(--border)}
.log-list{flex:1;overflow-y:auto;padding:4px}
.log-item{font-size:11px;margin-bottom:4px;padding:4px;border-radius:2px;cursor:pointer}
.log-item:hover{background:var(--bg)}
.log-item .meta{color:var(--dim);font-size:10px}
.log-item .meta .dir-send{color:#64b5f6}
.log-item .meta .dir-recv{color:var(--content)}
.log-item pre{display:none;background:var(--bg);padding:4px;margin-top:2px;border-radius:2px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;font-size:10px}
.log-item.expanded pre{display:block}
.log-item .summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>

<!-- Top bar -->
<div class="top">
  <input type="text" id="wsUrl" value="ws://localhost:8080" placeholder="ws://host:port">
  <button id="btnConnect" onclick="doConnect()">Connect</button>
  <button id="btnDisconnect" onclick="doDisconnect()" disabled>Disconnect</button>
  <span id="status" class="disconnected">Disconnected</span>
</div>

<!-- Main -->
<div class="main">
  <!-- Left panel -->
  <div class="left">
    <div class="section">
      <h3>Brain</h3>
      <select id="brainSelect" onchange="doBrainSet()"><option value="">-- 加载中 --</option></select>
      <button onclick="doBrainList()">刷新 Brain 列表</button>
    </div>
    <div class="section">
      <h3>Sense Group</h3>
      <div class="hint">按住 Ctrl/Cmd 多选，下一轮生效</div>
      <select id="senseSelect" multiple onchange="doSenseSet()"></select>
      <button onclick="doSenseList()">刷新 Sense 列表</button>
    </div>
    <div class="section">
      <h3>Chat</h3>
      <select id="chatIdSelect" onchange="handleChatIdSelectChange()">
        <option value="">-- 从 Log 选择 --</option>
        <option value="__manual__">手动输入...</option>
      </select>
      <input type="text" id="chatIdInput" placeholder="chatId (可选，留空自动生成)" style="display:none" onkeydown="handleChatIdInputKey(event)" onblur="handleChatIdInputBlur()">
      <button onclick="doChatCreate()">Create Chat</button>
      <button onclick="doChatList()">List Chats</button>
      <button onclick="syncChatId();doChatGet()">Load History</button>
      <button onclick="syncChatId();doChatResume()">Resume</button>
      <button onclick="syncChatId();doChatDelete()">Delete Chat</button>
    </div>
    <div class="section">
      <h3>Info</h3>
      <div style="font-size:11px;color:var(--dim)" id="infoPanel">
        chatId: -<br>brain: -<br>senseGroups: -
      </div>
    </div>
  </div>

  <!-- Center chat -->
  <div class="center">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <input type="text" id="msgInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')doSend()">
      <button onclick="doSend()">Send</button>
    </div>
  </div>

  <!-- Right log -->
  <div class="right">
    <h3>Raw Log <button onclick="clearLog()" style="float:right;font-size:10px;padding:0 6px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:2px;cursor:pointer">Clear</button></h3>
    <div class="log-list" id="logList"></div>
  </div>
</div>

<!-- Approval modal -->
<div class="modal-overlay" id="approvalModal">
  <div class="modal">
    <h3>⚠ Approval Required</h3>
    <div class="info">
      <span>Sense:</span> <strong id="modalSenseName"></strong><br>
      <span>Approval ID:</span> <code id="modalApprovalId"></code>
    </div>
    <div class="args-preview" id="modalArgs"></div>
    <textarea id="modalReason" rows="2" placeholder="Reason (optional)"></textarea>
    <div class="actions">
      <button class="btn-accept" onclick="doApproval('accept')">Accept</button>
      <button class="btn-reject" onclick="doApproval('reject')">Reject</button>
    </div>
  </div>
</div>

<script>
// ===== State =====
let ws = null;
let currentChatId = null;
let currentBrain = null;
let currentSenseGroups = [];
let pendingRequests = new Map();
let currentStreamEls = {};
let chatIdOptions = new Set();
let brainOptions = [];   // [{name, provider, model, ...}]
let senseGroupOptions = []; // [{name, senses, ...}]

// ===== UUID =====
function uuid() { return crypto.randomUUID(); }

// ===== Transport =====
function decodeMessage(data) {
  if (typeof data === 'string') return JSON.parse(data);
  const buf = (data instanceof Blob) ? data : new Blob([data]);
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => {
      const arr = new Uint8Array(reader.result);
      const type = arr[0];
      if (type === 0x01) {
        const view = new DataView(arr.buffer, arr.byteOffset, arr.byteLength);
        const seq = view.getUint32(1);
        const ridLen = arr[5];
        const rid = new TextDecoder().decode(arr.slice(6, 6 + ridLen));
        const json = new TextDecoder().decode(arr.slice(6 + ridLen));
        resolve({ kind: "chunk", type: "stream", requestId: rid, seq, data: JSON.parse(json) });
      } else if (type === 0x02) {
        resolve(JSON.parse(new TextDecoder().decode(arr.slice(1))));
      } else {
        resolve(null);
      }
    };
    reader.readAsArrayBuffer(buf);
  });
}

// ===== RPC =====
function sendRpc(method, params) {
  if (!ws || ws.readyState !== WebSocket.OPEN) { appendErrorMsg('Not connected'); return Promise.reject(new Error('Not connected')); }
  return new Promise((resolve, reject) => {
    const id = uuid();
    const req = { id, kind: "request", method, params };
    pendingRequests.set(id, { resolve, reject, method });
    ws.send(JSON.stringify(req));
    addLog('send', method, req);
    setTimeout(() => {
      if (pendingRequests.has(id)) {
        pendingRequests.delete(id);
        reject(new Error('Request timeout'));
      }
    }, 30000);
  });
}

// ===== Message Handling =====
async function handleRawMessage(raw) {
  const msg = await decodeMessage(raw);
  if (!msg) return;

  if (msg.kind === 'response') {
    addLog('recv', `response ${msg.success ? '✓' : '✗'}`, msg);
    const pending = pendingRequests.get(msg.requestId);
    if (pending) {
      pendingRequests.delete(msg.requestId);
      pending.resolve(msg);
    }
  } else if (msg.kind === 'chunk') {
    addLog('recv', `chunk(${msg.type}${msg.seq ? '#'+msg.seq : ''})`, msg);
    handleChunk(msg);
  } else if (msg.kind === 'notification') {
    addLog('recv', `notify(${msg.type})`, msg);
    handleNotification(msg);
  }
}

function handleChunk(chunk) {
  const rid = chunk.requestId;
  if (!currentStreamEls[rid]) currentStreamEls[rid] = {};
  const els = currentStreamEls[rid];

  if (chunk.type === 'stream') {
    const d = chunk.data || {};
    if (d.thinking) {
      if (!els.thinkingEl) {
        els.thinkingEl = createThinkingEl();
        getMsgContainer().appendChild(els.thinkingEl);
      }
      appendText(els.thinkingEl.querySelector('.body'), d.thinking);
    }
    if (d.content) {
      if (!els.contentEl) {
        els.contentEl = createContentEl();
        getMsgContainer().appendChild(els.contentEl);
      }
      appendText(els.contentEl, d.content);
    }
    if (d.senseCall) {
      if (!els.senseCallEl) {
        els.senseCallEl = createSenseCallEl();
        getMsgContainer().appendChild(els.senseCallEl);
      }
      updateSenseCall(els.senseCallEl, d.senseCall);
    }
  } else if (chunk.type === 'staged') {
    const d = chunk.data || {};
    const role = d.role || 'assistant';
    if (d.type === 'thinking_end') {
      if (els.thinkingEl) {
        els.thinkingEl.open = false;
        els.thinkingEl = null;
      } else if (role === 'assistant') {
        const el = document.createElement('details');
        el.className = 'msg msg-thinking';
        el.innerHTML = `<summary>Thinking</summary><div class="body">${esc(d.thinking || '')}</div>`;
        getMsgContainer().appendChild(el);
      }
    } else if (d.type === 'content_end') {
      if (els.contentEl) {
        els.contentEl = null;
      } else if (d.content) {
        const el = document.createElement('div');
        if (role === 'user') { el.className = 'msg msg-user'; el.textContent = d.content; }
        else { el.className = 'msg msg-content'; el.textContent = d.content; }
        getMsgContainer().appendChild(el);
      }
    } else if (d.type === 'sense_end') {
      const el = createSenseEndEl(d.senseName, d.arguments);
      getMsgContainer().appendChild(el);
    }
  }
  scrollBottom();
}

function handleNotification(notif) {
  const d = notif.data;
  switch (notif.type) {
    case 'interrupt':
      if (d.needsApproval) showApprovalModal(notif.requestId, d);
      break;
    case 'accept': {
      const el = document.createElement('div');
      el.className = 'msg msg-sense';
      el.innerHTML = `<div class="name">✅ ${esc(d.senseName)}</div><div class="result">${esc(d.result)}</div>`;
      getMsgContainer().appendChild(el);
      scrollBottom();
      break;
    }
    case 'rejected': {
      const el = document.createElement('div');
      el.className = 'msg msg-sense';
      el.innerHTML = `<div class="name">❌ ${esc(d.senseName)}</div><div class="result" style="color:var(--error)">${esc(d.reason)}</div>`;
      getMsgContainer().appendChild(el);
      scrollBottom();
      break;
    }
    case 'consumed':
      break;
    case 'loaded':
      appendSystemMsg('📋 History loaded');
      break;
    case 'done': {
      appendSystemMsg('✅ Done');
      if (notif.requestId && currentStreamEls[notif.requestId]) {
        delete currentStreamEls[notif.requestId];
      }
      break;
    }
    case 'error':
      appendErrorMsg(d.message);
      break;
  }
}

// ===== UI Helpers =====
function getMsgContainer() { return document.getElementById('messages'); }
function scrollBottom() { const c = getMsgContainer(); c.scrollTop = c.scrollHeight; }
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function appendText(el, text) { el.textContent += text; }

function appendUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-user';
  el.textContent = text;
  getMsgContainer().appendChild(el);
  scrollBottom();
}
function appendSystemMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-loaded';
  el.textContent = text;
  getMsgContainer().appendChild(el);
  scrollBottom();
}
function appendErrorMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg msg-error';
  el.textContent = '❌ ' + text;
  getMsgContainer().appendChild(el);
  scrollBottom();
}
function createThinkingEl() {
  const el = document.createElement('details');
  el.className = 'msg msg-thinking';
  el.open = true;
  el.innerHTML = '<summary>Thinking...</summary><div class="body"></div>';
  return el;
}
function createContentEl() {
  const el = document.createElement('div');
  el.className = 'msg msg-content';
  el.textContent = '';
  return el;
}
function createSenseCallEl() {
  const el = document.createElement('div');
  el.className = 'msg msg-sense';
  el.innerHTML = '<div class="name">⏳ Sense Call (streaming...)</div><div class="args"></div>';
  return el;
}
function updateSenseCall(el, deltas) {
  const argsEl = el.querySelector('.args');
  let text = '';
  for (const d of deltas) {
    if (d.name) text += `name: ${d.name}\n`;
    if (d.arguments) text += d.arguments;
  }
  argsEl.textContent = text;
}
function createSenseEndEl(name, args) {
  const el = document.createElement('div');
  el.className = 'msg msg-sense';
  const argsStr = args ? (typeof args === 'string' ? args : JSON.stringify(args, null, 2)) : '';
  el.innerHTML = `<div class="name">Sense: ${esc(name)}</div><div class="args">${esc(argsStr)}</div>`;
  return el;
}

// ===== Log =====
function addLog(dir, summary, obj) {
  const list = document.getElementById('logList');
  const item = document.createElement('div');
  item.className = 'log-item';
  const time = new Date().toLocaleTimeString();
  const cls = dir === 'send' ? 'dir-send' : 'dir-recv';
  item.innerHTML = `<div class="meta"><span class="${cls}">${dir.toUpperCase()}</span> ${time} ${esc(summary)}</div><div class="summary">${esc(JSON.stringify(obj).slice(0,80))}</div><pre>${esc(JSON.stringify(obj, null, 2))}</pre>`;
  item.ondblclick = () => item.classList.toggle('expanded');
  if (dir === 'send' && obj.method) {
    item.onclick = () => { if (!item.classList.contains('expanded')) handleLogItemClick(obj, 'send'); };
    item.style.cursor = 'pointer';
  } else if (dir === 'recv' && obj.success && obj.data) {
    item.onclick = () => { if (!item.classList.contains('expanded')) handleLogItemClick(obj, 'recv'); };
    item.style.cursor = 'pointer';
  }
  list.appendChild(item);
  list.scrollTop = list.scrollHeight;
}
function clearLog() { document.getElementById('logList').innerHTML = ''; }

// ===== Actions =====
function doConnect() {
  const url = document.getElementById('wsUrl').value;
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    document.getElementById('status').textContent = 'Connected';
    document.getElementById('status').className = 'connected';
    document.getElementById('btnConnect').disabled = true;
    document.getElementById('btnDisconnect').disabled = false;
    appendSystemMsg('🔗 Connected to ' + url);
    // 自动拉取 brain / sense 列表
    doBrainList();
    doSenseList();
  };
  ws.onclose = () => {
    document.getElementById('status').textContent = 'Disconnected';
    document.getElementById('status').className = 'disconnected';
    document.getElementById('btnConnect').disabled = false;
    document.getElementById('btnDisconnect').disabled = true;
    appendSystemMsg('🔌 Disconnected');
    ws = null;
  };
  ws.onerror = () => appendErrorMsg('WebSocket error');
  ws.onmessage = (e) => handleRawMessage(e.data);
}
function doDisconnect() { if (ws) ws.close(); }

// ===== Brain / Sense 列表 =====
async function doBrainList() {
  try {
    const res = await sendRpc('brain.list', {});
    if (res.success) {
      brainOptions = res.data.brains || [];
      const sel = document.getElementById('brainSelect');
      sel.innerHTML = brainOptions.length
        ? brainOptions.map(b => `<option value="${esc(b.name)}">${esc(b.name)} (${esc(b.model)})</option>`).join('')
        : '<option value="">-- 无 --</option>';
      if (brainOptions.length) {
        currentBrain = brainOptions[0].name;
        updateInfo();
      }
    } else { appendErrorMsg(res.error?.message || 'brain.list failed'); }
  } catch (e) { appendErrorMsg(e.message); }
}

async function doSenseList() {
  try {
    const res = await sendRpc('sense.list', {});
    if (res.success) {
      senseGroupOptions = res.data.senseGroups || [];
      const sel = document.getElementById('senseSelect');
      sel.innerHTML = senseGroupOptions.map(g =>
        `<option value="${esc(g.name)}">${esc(g.name)} (${(g.senses||[]).join(', ')})</option>`).join('');
      // 默认选第一个
      if (senseGroupOptions.length) {
        sel.options[0].selected = true;
        currentSenseGroups = [senseGroupOptions[0].name];
        updateInfo();
      }
    } else { appendErrorMsg(res.error?.message || 'sense.list failed'); }
  } catch (e) { appendErrorMsg(e.message); }
}

// ===== Chat 管理 =====
async function doChatCreate() {
  const params = {};
  const manual = document.getElementById('chatIdInput').value.trim();
  if (document.getElementById('chatIdInput').style.display !== 'none' && manual) {
    params.chatId = manual;
  }
  try {
    const res = await sendRpc('chat.create', params);
    if (res.success) {
      currentChatId = res.data.chatId;
      populateChatIdSelect(currentChatId);
      updateInfo();
      appendSystemMsg(`💬 Chat created: ${currentChatId}`);
      // 自动应用当前选择的 brain / sense 到新 chat
      if (document.getElementById('brainSelect').value) await doBrainSet();
      if (Array.from(document.getElementById('senseSelect').selectedOptions).length) await doSenseSet();
    } else { appendErrorMsg(res.error?.message || 'Create failed'); }
  } catch (e) { appendErrorMsg(e.message); }
}

async function doChatList() {
  try {
    const res = await sendRpc('chat.list', {});
    if (res.success) {
      const chats = res.data.chats || [];
      appendSystemMsg(`💬 Chats (${chats.length}): ` + chats.map(c => `${c.chatId}(${c.messageCount}msg)`).join(', '));
      chats.forEach(c => populateChatIdSelect(c.chatId, { messageCount: c.messageCount, updatedAt: c.updatedAt }));
    } else { appendErrorMsg(res.error?.message || 'List failed'); }
  } catch (e) { appendErrorMsg(e.message); }
}

async function doChatGet() {
  if (!currentChatId) { appendErrorMsg('No chatId. Create or select one first.'); return; }
  // 清空消息区
  document.getElementById('messages').innerHTML = '';
  const req = { id: uuid(), kind: "request", method: "chat.get", params: { chatId: currentChatId } };
  ws.send(JSON.stringify(req));
  addLog('send', 'chat.get', req);
  appendSystemMsg('📜 Loading history...');
}

async function doChatDelete() {
  if (!currentChatId) { appendErrorMsg('No chatId'); return; }
  try {
    const res = await sendRpc('chat.delete', { chatId: currentChatId });
    if (res.success) {
      appendSystemMsg(`🗑 Chat deleted: ${currentChatId}`);
      currentChatId = null;
      updateInfo();
    } else { appendErrorMsg(res.error?.message || 'Delete failed'); }
  } catch (e) { appendErrorMsg(e.message); }
}

// ===== Resume（恢复 pending sense 执行） =====
async function doChatResume() {
  if (!currentChatId) { appendErrorMsg('No chatId'); return; }
  if (!ws || ws.readyState !== WebSocket.OPEN) { appendErrorMsg('Not connected'); return; }
  const req = { id: uuid(), kind: "request", method: "chat.resume", params: { chatId: currentChatId } };
  ws.send(JSON.stringify(req));
  addLog('send', 'chat.resume', req);
  appendSystemMsg('▶ Resuming pending senses...');
  const rid = req.id;
  pendingRequests.set(rid, {
    method: 'chat.resume',
    resolve: () => { delete currentStreamEls[rid]; },
    reject: () => { delete currentStreamEls[rid]; }
  });
}

// ===== Brain / Sense 设置（独立调用，每轮可换） =====
async function doBrainSet() {
  const brainSel = document.getElementById('brainSelect');
  if (!brainSel.value) { return; }
  currentBrain = brainSel.value;
  updateInfo();
  if (!currentChatId) { return; }  // 未创建 chat，仅记录选择
  try {
    const res = await sendRpc('brain.set', { chatId: currentChatId, brain: currentBrain });
    if (!res.success) appendErrorMsg('brain.set failed: ' + (res.error?.message || 'unknown'));
    else appendSystemMsg(`🧠 Brain set: ${currentBrain}`);
  } catch (e) { appendErrorMsg(e.message); }
}

async function doSenseSet() {
  const senseSel = document.getElementById('senseSelect');
  currentSenseGroups = Array.from(senseSel.selectedOptions).map(o => o.value);
  updateInfo();
  if (!currentChatId || currentSenseGroups.length === 0) { return; }
  try {
    const res = await sendRpc('sense.set', { chatId: currentChatId, senseGroups: currentSenseGroups });
    if (!res.success) appendErrorMsg('sense.set failed: ' + (res.error?.message || 'unknown'));
    else appendSystemMsg(`👁 Sense set: ${currentSenseGroups.join(', ')}`);
  } catch (e) { appendErrorMsg(e.message); }
}

// ===== Send =====
function doSend() {
  if (!ws || ws.readyState !== WebSocket.OPEN) { appendErrorMsg('Not connected'); return; }
  if (!currentChatId) { appendErrorMsg('No chatId. Create a chat first.'); return; }

  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  appendUserMsg(text);

  const params = {
    chatId: currentChatId,
    prompt: text,
  };
  const req = { id: uuid(), kind: "request", method: "chat.send", params };
  ws.send(JSON.stringify(req));
  addLog('send', 'chat.send', req);

  const rid = req.id;
  pendingRequests.set(rid, {
    method: 'chat.send',
    resolve: () => { delete currentStreamEls[rid]; },
    reject: () => { delete currentStreamEls[rid]; }
  });
}

// ===== Approval =====
let pendingApproval = null;
function showApprovalModal(requestId, data) {
  pendingApproval = { requestId, ...data };
  document.getElementById('modalSenseName').textContent = data.senseName;
  document.getElementById('modalApprovalId').textContent = data.approvalId;
  document.getElementById('modalArgs').textContent = data.arguments || '(no args)';
  document.getElementById('modalReason').value = '';
  document.getElementById('approvalModal').classList.add('active');
}
async function doApproval(action) {
  if (!pendingApproval) return;
  document.getElementById('approvalModal').classList.remove('active');
  const reason = document.getElementById('modalReason').value.trim();
  try {
    const res = await sendRpc('sense.approval', {
      approvalId: pendingApproval.approvalId,
      action,
      reason: reason || undefined,
    });
    if (!res.success) appendErrorMsg('Approval failed: ' + (res.error?.message || 'unknown'));
  } catch (e) { appendErrorMsg(e.message); }
  pendingApproval = null;
}

// ===== Chat ID Select =====
function handleChatIdSelectChange() {
  const select = document.getElementById('chatIdSelect');
  const input = document.getElementById('chatIdInput');
  const value = select.value;
  if (value === '__manual__') {
    input.style.display = 'block';
    input.value = '';
    input.focus();
  } else {
    input.style.display = 'none';
    if (value) { currentChatId = value; updateInfo(); }
  }
}
function handleChatIdInputKey(e) {
  const input = document.getElementById('chatIdInput');
  if (e.key === 'Enter') {
    const id = input.value.trim();
    if (id) { populateChatIdSelect(id); input.style.display = 'none'; }
  } else if (e.key === 'Escape') {
    input.style.display = 'none';
    document.getElementById('chatIdSelect').value = '';
  }
}
function handleChatIdInputBlur() {
  const input = document.getElementById('chatIdInput');
  const select = document.getElementById('chatIdSelect');
  const id = input.value.trim();
  if (id) populateChatIdSelect(id);
  input.style.display = 'none';
  if (!id && select.value === '__manual__') select.value = '';
}
function populateChatIdSelect(id, info) {
  if (!id) return;
  const select = document.getElementById('chatIdSelect');
  if (chatIdOptions.has(id)) {
    select.value = id;
    currentChatId = id;
    updateInfo();
    return;
  }
  chatIdOptions.add(id);
  let label = id;
  if (info) {
    const count = info.messageCount || 0;
    const time = info.updatedAt ? formatTime(info.updatedAt) : '';
    if (count || time) label = `${id} (${count}msg${time ? ', ' + time : ''})`;
  }
  const manualOption = select.querySelector('option[value="__manual__"]');
  const newOption = document.createElement('option');
  newOption.value = id;
  newOption.textContent = label;
  select.insertBefore(newOption, manualOption);
  select.value = id;
  currentChatId = id;
  updateInfo();
}
function syncChatId() {
  const select = document.getElementById('chatIdSelect');
  const input = document.getElementById('chatIdInput');
  const sv = select.value;
  if (sv && sv !== '__manual__') { currentChatId = sv; }
  else if (input.style.display !== 'none' && input.value.trim()) { currentChatId = input.value.trim(); }
  updateInfo();
}
function handleLogItemClick(obj, dir) {
  const data = obj.data || {};
  const params = obj.params || {};
  if (params.chatId) populateChatIdSelect(params.chatId);
  if (data.chatId) populateChatIdSelect(data.chatId);
  if (data.chats && Array.isArray(data)) data.chats.forEach(c => { if (c.chatId) populateChatIdSelect(c.chatId); });
}

// ===== Time / Info =====
function formatTime(timestamp) {
  const d = new Date(timestamp);
  const pad = n => n.toString().padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function updateInfo() {
  document.getElementById('infoPanel').innerHTML =
    `chatId: ${currentChatId || '-'}<br>brain: ${currentBrain || '-'}<br>senseGroups: ${currentSenseGroups.join(', ') || '-'}`;
}
