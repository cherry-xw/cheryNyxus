# 模型目录：匹配规则、事实信息、编辑器推荐，以及 thinking 协议映射。
# 默认规则覆盖已核对官方资料的 MiniMax、DeepSeek、GLM、Step、MiMo、Grok、GPT 系列。
# 所有具体模型规则都在本文件中，可直接增删改；程序代码不内置厂商规则。
# 默认规则按“主体模型名 + 版本”正则匹配，可兼容中转前缀和变体/日期后缀。
version: 1

# 未匹配具体规则时写入保守草稿：256K、关闭显式思考、保持工具兼容、关闭媒体。
# 协议与服务商按模型名推断：GPT 系名称（含未来版本，如 GPT-7/8）推荐 openai + openai-responses；
# Claude 系名称（claude/opus/sonnet/haiku）推荐 anthropic-messages 协议（保留当前服务商）；
# 其余完全未知名称推荐 openai + openai-chat-completions。
# 在下方 recommend 中显式写 provider / protocol 可覆盖按名称推断的结果。
unknown:
  recommend:
    contextLimit: 256000
    thinking: off
    capabilities:
      toolCall: true
      input: { image: unknown, video: unknown, audio: unknown, pdf: unknown }
      output: { image: unknown, video: unknown, audio: unknown }
  capabilities:
    toolCall: true
    input: { image: unknown, video: unknown, audio: unknown, pdf: unknown }
    output: { image: unknown, video: unknown, audio: unknown }

models:
  - id: minimax-m3
    match:
      models:
        - regex: (?:^|[/_.:-])minimax[-_.]?m3(?:$|[-_/:])
          flags: i
    facts:
      contextWindow: 1000000
      protocols:
        - openai-chat-completions
        - openai-responses
        - anthropic-messages
      capabilities:
        imageInput:
          formats:
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
          animation: unknown
          maxBytes: 10000000
        toolCall: true
        input:
          image: true
          video: false
          audio: false
        output:
          image: false
          video: false
          audio: false
    recommend:
      provider: minimax
      protocol: openai-chat-completions
      contextLimit: 250000
      thinking: 'on'
      capabilities:
        toolCall: true
        input:
          image: true
          video: false
          audio: false
        output:
          image: false
          video: false
          audio: false
    recommendByProtocol:
      openai-chat-completions:
        protocol: openai-chat-completions
        contextLimit: 250000
        thinking: 'on'
        capabilities:
          toolCall: true
          input:
            image: true
          output:
            image: false
      openai-responses:
        protocol: openai-responses
        contextLimit: 250000
        thinking: 'on'
        capabilities:
          toolCall: true
          input:
            image: true
          output:
            image: false
      anthropic-messages:
        protocol: anthropic-messages
        contextLimit: 250000
        thinking: 'on'
        capabilities:
          toolCall: true
          input:
            image: true
          output:
            image: false
    wire:
      openai-chat-completions:
        thinking:
          - display: 'off'
            params:
              thinking:
                type: disabled
              reasoning_split: true
          - display: 'on'
            params:
              thinking:
                type: adaptive
              reasoning_split: true
      openai-responses:
        thinking:
          - display: 'off'
            params:
              reasoning:
                effort: none
          - display: 'on'
            params:
              reasoning:
                effort: medium
      anthropic-messages:
        thinking:
          - display: 'off'
            params: {}
          - display: 'on'
            params:
              thinking:
                type: adaptive

