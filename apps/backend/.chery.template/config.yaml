# 首次启动只需在「设置 → 大脑」中完成 default 的模型与连接配置；完整字段见 docs/config.md。
global:
  # 必填项（无运行默认）
  thinking: true
  supervision: manual
  stream: true
  # 以下为可选覆盖（省略时自动采用运行默认值，设置面板直接显示实际默认且不写入）：
  # llm_request_timeout_ms: 600000 # 单次模型请求最多 10 分钟；0 = 不限时
  # sense_execute_timeout: 30000 # 单次工具执行等待超时（毫秒）
  # approval_timeout: 300000 # 审批等待超时（毫秒；0 = 不设业务截止时间）
  # approval_hard_timeout: 1800000 # 审批运行资源上限（毫秒）
  # disconnect_grace_ms: 15000 # 断连等待宽限（毫秒）
  # maxLoopCount: 30 # 单次运行最大工具调用轮数
  # tree_full_render_threshold: 150 # 节点树全量渲染基础阈值（卡牌模式上限 120）
  # history_recall:
  #   max_output_chars: 4000
  # watchdog:
  #   timeout_ms: 300000
  #   wake_on_timeout: false
  # textEditor: <EDITOR_COMMAND> # 留空使用后端主机系统默认打开方式
  # file_compression:
  #   truncate_threshold: 102400
  #   truncate_preview_lines: 100
  #   log_file_extensions: [.log, .txt, .out, .err]
  #   drain_preview_count: 3
  # logger:
  #   level: info
  #   output: [console]
  #   timestamp: true
  #   location: true
  #   format: json
# files: # 可选策略段；未填写时采用运行默认（适配上限 5MB/2048px/质量 85、图片保留 1 轮等）
#   imageGeneration:
#     defaultCount: 1
#   imageContext:
#     mode: recent
#     recentUserTurns: 1
#     replacement: description
#     missingDescription: existing
#     maxDescriptionChars: 600
#     maxTotalDescriptionChars: 6000
llm:
  brain:
    default:
      # url 可选：留空时按服务与协议采用默认基础地址（如 https://api.openai.com/v1）
      model: <YOUR_MODEL_NAME>
      key: $LLM_API_KEY
      provider: openai
      protocol: openai-chat-completions
      contextLimit: 128000 # 必填：正整数上下文 token 容量（目录推荐仅在主动点击采用时写入）
sense_groups:
  cheryNyxus:
    - read_file
    - skill
    - write_file
    - execute_command
    - search_codebase
    - spawn_role
    - ask_user_question
    - history_recall
    - install_skill
    - config_manage
    - role_acceptance
    - file_capabilities
    - file_assets_list
    - file_asset_read
    - file_images_find
    - file_image_read
    - file_operation
    - select_task_deliverables
  detail_diagnostics:
    - read_file
    - search_codebase
    - execute_command
  curator:
    - memory_manage
    - read_file
    - search_codebase
    - ask_user_question
  conversation_routing:
    - select_conversation:auto
  role_architect:
    - skill
    - read_file
    - search_codebase
    - ask_user_question
  role_acceptance:
    - skill
roles:
  cheryNyxus:
    brain: default
    avatar: 🐈
    description: cheryNyxus：系统配置管理核心角色（管理所有角色配置）+ 桌宠组长
    senseGroup: cheryNyxus
    mcpServers: []
    systemPrompt: prompt/cheryNyxus/cheryNyxus.md
    lock: true
    id: role-c93be74de4d4aba9
  curator:
    brain: default
    description: 记忆维护：每轮提取记忆、定期整理（Extract/Dream）
    mentionable: true
    senseGroup: curator
    mcpServers: []
    systemPrompt: prompt/curator/curator.md
    lock: true
    id: role-253976855f08111c
  explanation:
    brain: default
    description: 只解释所选节点的概念与因果，不执行项目任务
    mentionable: false
    senseGroup: detail_diagnostics
    mcpServers: []
    id: role-f78fcae67d4aa998
  conversation_router:
    kind: shadow
    brain: default
    description: 在发送后选择应继续的历史会话或新建会话，不进入节点树
    senseGroup: conversation_routing
    mcpServers: []
    id: role-4dd18552fe5839d7
  roleArchitect:
    avatar: 🧩
    brain: default
    description: 角色架构师：研究任意岗位并输出职责、风险、能力诉求与验收蓝图；不修改配置
    id: role-rolearchitect0001
    mentionable: false
    senseGroup: role_architect
    mcpServers: []
    systemPrompt: prompt/roleArchitect/roleArchitect.md
    lock: true
    skills:
      - role-design
  roleAcceptance:
    avatar: 🧪
    brain: default
    description: 独立角色验收器：只依据隔离执行证据判定，不修改配置或执行目标任务
    id: role-roleacceptance001
    mentionable: false
    senseGroup: role_acceptance
    mcpServers: []
    systemPrompt: prompt/roleAcceptance/roleAcceptance.md
    lock: true
    skills:
      - role-acceptance
    permissions:
      template: read-only
presets:
  cheryNyxus:
    id: preset-c93be74de4d4aba9
    shadows:
      conversationRouting: conversation_router
    detailRole: explanation
    leader: cheryNyxus
    roles:
      - cheryNyxus
      - roleArchitect
      - roleAcceptance
      - curator
      - explanation
memory:
  global:
    max_count: 30
    max_chars: 500
  workspace:
    max_count: 15
    max_chars: 500
server:
  port: 8182
  webPort: 8183
  transport: binary
  host: 127.0.0.1
  serve_frontend: true
  # Relay mode: creates two additional 127.0.0.1-only listeners. Keep disabled
  # unless password or OIDC authentication is configured above.
  remote:
    enabled: false
    httpPort: 0
    websocketPort: 0
# 本地管理器监听地址（apps/manager/ 独立进程，缺省 127.0.0.1；0.0.0.0 或内网 IP 开放内网访问，
# 访问需携带启动日志 URL 上的管理密钥；优先级 CHERY_MANAGER_HOST > 本字段）。
manager:
  host: 127.0.0.1
