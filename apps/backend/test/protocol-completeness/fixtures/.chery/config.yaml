      "protocol_spawn_replacement": {
        "model": "protocol_spawn_replacement",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/spawn-replacement.yaml"
        }
      }
    }
  },
  "sense_groups": {
    "protocol_none": [],
    "protocol_files": [
      "read_file:auto"
    ],
    "protocol_write": [
      "write_file:manual"
    ],
    "protocol_questions": [
      "ask_user_question:auto"
    ],
    "protocol_spawn": [
      "spawn_role:auto"
    ],
    "protocol_spawn_v2": [
      "spawn_role:auto"
    ]
  },
  "mcp_servers": {},
  "roles": {
    "protocol_leader": {
      "scope": "private",
      "brain": "protocol_content",
      "senseGroup": "protocol_none",
      "mcpServers": [],
      "permissions": {
        "template": "trusted"
      }
    },
    "protocol_reader": {
      "scope": "public",
      "brain": "protocol_read_file",
      "senseGroup": "protocol_files",
      "mcpServers": [],
      "permissions": {
        "template": "trusted"
      }
    },
    "protocol_failing": {
      "scope": "public",
      "brain": "protocol_auth_failure",
      "senseGroup": "protocol_none",
      "mcpServers": [],
      "permissions": {
        "template": "trusted"
      }
    },
    "protocol_slow": {
      "scope": "public",
      "brain": "protocol_abort",
      "senseGroup": "protocol_none",
      "mcpServers": [],
      "permissions": {
        "template": "trusted"
      }
    },
    "protocol_replacement": {
      "scope": "public",
      "brain": "protocol_content",
      "senseGroup": "protocol_none",
      "mcpServers": [],
      "permissions": {
        "template": "trusted"
      }
    },
    "protocol_reader_leader": {
      "scope": "private",
      "brain": "protocol_spawn_reader",
      "senseGroup": "protocol_spawn",
      "mcpServers": [],
      "permissions": {
        "template": "trusted"
      }
    },
    "protocol_failure_leader": {
      "scope": "private",
      "brain": "protocol_spawn_failure",
      "senseGroup": "protocol_spawn",
      "mcpServers": [],
      "permissions": {
        "template": "trusted"
      }
    },
    "protocol_slow_leader": {
      "scope": "private",
      "brain": "protocol_spawn_slow",
      "senseGroup": "protocol_spawn",
      "mcpServers": [],
      "permissions": {
        "template": "trusted"
      }
    }
  },
  "presets": {
    "默认": {
      "leader": "protocol_leader",
      "roles": [
        "protocol_leader"
      ]
    },
    "protocol-spawn-reader": {
      "leader": "protocol_reader_leader",
      "roles": [
        "protocol_reader_leader",
        "protocol_reader",
        "protocol_replacement"
      ]
    },
    "protocol-spawn-failure": {
      "leader": "protocol_failure_leader",
      "roles": [
        "protocol_failure_leader",
        "protocol_failing"
      ]
    },
    "protocol-spawn-slow": {
      "leader": "protocol_slow_leader",
      "roles": [
        "protocol_slow_leader",
        "protocol_slow"
      ]
    }
  }
}
