        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/approval.yaml"
        }
      },
      "protocol_question": {
        "model": "protocol_question",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/question.yaml"
        }
      },
      "protocol_abort": {
        "model": "protocol_abort",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/abort.yaml"
        }
      },
      "protocol_stream": {
        "model": "protocol_stream",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/stream.yaml"
        }
      },
      "protocol_queue": {
        "model": "protocol_queue",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/queue.yaml"
        }
      },
      "protocol_retry_partial": {
        "model": "protocol_retry_partial",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/retry-partial.yaml"
        }
      },
      "protocol_spawn_reader": {
        "model": "protocol_spawn_reader",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
