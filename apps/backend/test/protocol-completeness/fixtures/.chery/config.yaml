      "protocol_spawn_failure": {
        "model": "protocol_spawn_failure",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/spawn-failure.yaml"
        }
      },
      "protocol_spawn_slow": {
        "model": "protocol_spawn_slow",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/spawn-slow.yaml"
        }
