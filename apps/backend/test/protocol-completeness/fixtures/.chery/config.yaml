{
  "global": {
    "thinking": true,
    "supervision": "auto",
    "stream": true,
    "logger": {
      "level": "warn",
      "output": [
        "console"
      ]
    }
  },
  "server": {
    "host": "127.0.0.1",
    "port": 0,
    "webPort": 0,
    "serve_frontend": false
  },
  "llm": {
    "brain": {
      "protocol_content": {
        "model": "protocol_content",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/content.yaml"
        }
      },
      "protocol_read_file": {
        "model": "protocol_read_file",
        "provider": "mock",
        "contextLimit": 128000,
        "mock": {
          "enabled": true,
          "file": "mock/read-file.yaml"
        }
      },
      "protocol_retry": {
        "model": "protocol_retry",
        "provider": "mock",
        "contextLimit": 128000,
