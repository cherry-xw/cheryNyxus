# recover-revoke 场景：confirm sense pending（write_file:confirm）
# id recover-wf-3 唯一；chat.send 撤回后重跑 turn0 再次触发 confirm
repeat: last
script:
  - thinking: "需要写文件，请求审批"
    content: "准备写文件"
    senseCalls:
      - id: "recover-wf-3"
        name: "write_file"
        arguments: '{"path":"/tmp/cheryclaw-recover-3.txt","content":"x"}'
  - content: "文件已处理完毕"
