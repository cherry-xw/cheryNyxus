llm:
  clients:
    ollama: # 自定义name
      url: $OLLAMA_HOST # $xxx 在.env中定义
      model: gemma3:1b
      thinking: false # 思考模式（使用 deepseek-r1 等模型时改为 true）
      provider: ollama # 用于选择哪个llm，需要与message中的provider对应
      tool_group: safe_tools # 使用的tool group名称
    openai:
      url: https://api.openai.com/v1
      model: gpt-3.5-turbo
      key: $OPENAI_API_KEY
      provider: openai
      tool_group: safe_tools
    longcat:
      url: https://api.longcat.chat/openai
      model: LongCat-Flash-Thinking-2601
      key: $LONGCAT_API_KEY
      thinking: true # 思考模式（这是对这个模型有没有think能力的配置）
      provider: openai
      tool_group: [safe_tools, dangerous_tools]
    deepseek:
      url: https://api.deepseek.com
      model: deepseek-v4-flash
      key: $DEEPSEEK_API_KEY
      thinking: true
      provider: openai
      tool_group: [safe_tools, dangerous_tools]
    doubao:
      url: http://yz.xcherry.top:11411/v1
      model: doubao2.0-pro
      key: $DOUBAO_API_KEY
      thinking: true
      provider: openai
      tool_group: [safe_tools, dangerous_tools]
    ali_glm5:
      url: https://coding.dashscope.aliyuncs.com/v1
      model: glm-5
      key: $ALI_API_KEY
      thinking: true
      provider: openai
      tool_group: [safe_tools, dangerous_tools]

# Tool分组配置
tool_groups:
  safe_tools:
    tools:
      - read_file
      - skill
  dangerous_tools:
    tools:
      - delete_file
      - execute_command
      - write_file

# 全局配置
global:
  thinking: true # 是否开启思考模式（如果能思考）
  supervision: manual # 全局默认的监管等级，可选 auto:全部自动、confirm:按工具默认、manual:全部手动确认
  stream: true # 是否开启流式输出
  tool_execute_timeout: 10000 # 工具执行超时时间（毫秒），默认 30 秒
  bash_log_retention_hours: 24 # bash 日志文件保留时间（小时），默认 24 小时

  # 文件压缩配置
  file_compression:
    truncate_threshold: 50000 # 50KB截断阈值（字节），超过此大小触发截断
    truncate_preview_lines: 100 # 截断时保留的行数
    log_file_extensions: # 日志文件扩展名列表（用于自动判断）
      - .log
      - .txt
      - .out
      - .err
    drain_preview_count: 3 # Drain算法每个模板显示的实例数