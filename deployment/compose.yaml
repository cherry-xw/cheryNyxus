name: cherynyxus

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ..
      dockerfile: apps/backend/deploy/docker/Dockerfile
    image: cherynyxus-backend:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=256m"]
    shm_size: 512m
    environment:
      QQBOT_ROLE: backend
      CHERY_COMMAND_DIRECT: "${CHERY_COMMAND_DIRECT:-1}"
      HOME: /app/apps/backend/.chery/tool-home
      NPM_CONFIG_PREFIX: /app/apps/backend/.chery/tool-home/npm
      NPM_CONFIG_CACHE: /app/apps/backend/.chery/tool-home/cache/npm
      XDG_CACHE_HOME: /app/apps/backend/.chery/tool-home/cache
      PLAYWRIGHT_BROWSERS_PATH: /app/apps/backend/.chery/tool-home/browsers
      PIP_CACHE_DIR: /app/apps/backend/.chery/tool-home/cache/pip
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PATH: /app/apps/backend/.chery/tool-home/venv/bin:/app/apps/backend/.chery/tool-home/npm/bin:/usr/local/bin:/usr/bin:/bin
      CHERY_DIR: /app/apps/backend
      CHERY_ENV_FILE: /app/apps/backend/.env
      DB_DIR: /app/apps/backend/.chery/data
      QQBOT_CONNECTION_TOKEN_FILE: /app/apps/backend/.chery/qq-connection-token.json
      CHERY_MANAGER_HOST: 0.0.0.0
      CHERY_MANAGER_PORT: "39980"
      WEB_PORT: "8283"
      QQ_INGRESS_PAUSED: ${QQ_INGRESS_PAUSED:-1}
      CHERY_INGRESS_INSTALL_ROOT: /app/opt
      QQ_USER_FILES_ROOT: /app/user-files
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    secrets: [chery_auth_session_secret, qqbot_platform_token, qqbot_model_key]
    ports:
      - "${QQBOT_RPC_BIND:-0.0.0.0}:${QQBOT_RPC_PORT:-8282}:8282"
      - "${QQBOT_WEB_BIND:-0.0.0.0}:${WEB_PORT:-8283}:8283"
      - "${NYXUS_MANAGER_BIND:-127.0.0.1}:${NYXUS_MANAGER_PORT:-39980}:39980"
    volumes:
      - ${QQBOT_ENV_FILE:-./qqbot.env}:/app/apps/backend/.env
      - ${QQBOT_DATA_DIR:-./qqbot-data}/.chery:/app/apps/backend/.chery
      - ${QQBOT_DATA_DIR:-./qqbot-data}/data:/app/apps/backend/data
      - ${QQ_USER_FILES_DIR:-./user-files}:/app/user-files
    networks: [backend]
    logging: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const k=JSON.parse(require('fs').readFileSync('/app/apps/backend/.chery/manager-token.json','utf8')).token;
          const r=require('http').get({hostname:'127.0.0.1',port:39980,path:'/api/machine/status',headers:{'x-chery-manager-machine-key':k}},r=>{
          r.resume();process.exit(r.statusCode===200?0:1)});
          r.setTimeout(3000,()=>r.destroy(new Error('timeout')));r.once('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  web:
    profiles: [management]
    build:
      context: ..
      dockerfile: apps/web/deploy/docker/Dockerfile
    image: cherynyxus-web:local
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    environment:
      NYXUS_WEB_BIND: ${NYXUS_WEB_BIND:-0.0.0.0}
      NYXUS_WEB_PORT: ${NYXUS_WEB_PORT:-8080}
      NYXUS_BACKEND_HTTP: http://127.0.0.1:${WEB_PORT:-8283}
      NYXUS_BACKEND_WS: http://127.0.0.1:${QQBOT_RPC_PORT:-8282}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'node -e "require(''http'').get(''http://${NYXUS_WEB_BIND:-127.0.0.1}:${NYXUS_WEB_PORT:-8080}/healthz'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 6
networks:
  backend: {}

secrets:
  chery_auth_session_secret:
    file: ${CHERY_AUTH_SESSION_SECRET_FILE:-./secrets/chery_auth_session_secret}
  qqbot_platform_token:
    file: ${QQBOT_PLATFORM_TOKEN_FILE:-./secrets/qqbot_platform_token}
  qqbot_model_key:
    file: ${QQBOT_MODEL_KEY_FILE:-./secrets/qqbot_model_key}
