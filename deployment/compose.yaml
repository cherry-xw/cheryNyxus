name: cherynyxus

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ..
      dockerfile: apps/backend/deploy/docker/Dockerfile
    image: cherynyxus-backend:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=256m"]
    shm_size: 512m
    environment:
      QQBOT_ROLE: backend
      CHERY_COMMAND_DIRECT: "${CHERY_COMMAND_DIRECT:-1}"
      HOME: /app/platform/qqbot/.chery/tool-home
      NPM_CONFIG_PREFIX: /app/platform/qqbot/.chery/tool-home/npm
      NPM_CONFIG_CACHE: /app/platform/qqbot/.chery/tool-home/cache/npm
      XDG_CACHE_HOME: /app/platform/qqbot/.chery/tool-home/cache
      PLAYWRIGHT_BROWSERS_PATH: /app/platform/qqbot/.chery/tool-home/browsers
      PIP_CACHE_DIR: /app/platform/qqbot/.chery/tool-home/cache/pip
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PATH: /app/platform/qqbot/.chery/tool-home/venv/bin:/app/platform/qqbot/.chery/tool-home/npm/bin:/usr/local/bin:/usr/bin:/bin
      CHERY_DIR: /app/platform/qqbot
      CHERY_ENV_FILE: /app/platform/qqbot/.chery/runtime.env
      DB_DIR: /app/platform/qqbot/.chery/data
      QQBOT_CONNECTION_TOKEN_FILE: /app/platform/qqbot/.chery/qq-connection-token.json
      WEB_PORT: "8283"
      QQ_INGRESS_PAUSED: ${QQ_INGRESS_PAUSED:-1}
      CHERY_INGRESS_INSTALL_ROOT: /app/opt
      QQ_USER_FILES_ROOT: /app/user-files
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
    secrets: [chery_auth_session_secret, qqbot_platform_token, qqbot_model_key]
    ports:
      - "${QQBOT_RPC_BIND:-0.0.0.0}:${QQBOT_RPC_PORT:-8282}:8282"
      - "${QQBOT_WEB_BIND:-0.0.0.0}:${WEB_PORT:-8283}:8283"
    volumes:
      - ${QQBOT_ENV_FILE:-./qqbot.env}:/app/platform/qqbot/.chery/runtime.env
      - ${QQBOT_DATA_DIR:-./qqbot-data}/.chery:/app/platform/qqbot/.chery
      - ${QQBOT_DATA_DIR:-./qqbot-data}/data:/app/platform/qqbot/data
      - ${QQ_USER_FILES_DIR:-./user-files}:/app/user-files
    networks: [backend]
    logging: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const net=require('net'),http=require('http');
          const tcp=new Promise((ok,fail)=>{const s=net.connect(8282,'127.0.0.1');
          s.setTimeout(3000,()=>s.destroy(new Error('timeout')));
          s.once('connect',()=>{s.destroy();ok()});s.once('error',fail)});
          const web=new Promise((ok,fail)=>{const r=http.get('http://127.0.0.1:8283/api/config',r=>{
          r.resume();(r.statusCode===200||r.statusCode===401)?ok():fail()});
          r.setTimeout(3000,()=>r.destroy(new Error('timeout')));r.once('error',fail)});
          Promise.all([tcp,web]).then(()=>process.exit(0),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
  web:
    profiles: [management]
    build:
      context: ..
      dockerfile: apps/web/deploy/docker/Dockerfile
    image: cherynyxus-web:local
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    environment:
      NYXUS_WEB_BIND: ${NYXUS_WEB_BIND:-0.0.0.0}
      NYXUS_WEB_PORT: ${NYXUS_WEB_PORT:-8080}
      NYXUS_BACKEND_HTTP: http://127.0.0.1:${WEB_PORT:-8283}
      NYXUS_BACKEND_WS: http://127.0.0.1:${QQBOT_RPC_PORT:-8282}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'node -e "require(''http'').get(''http://${NYXUS_WEB_BIND:-127.0.0.1}:${NYXUS_WEB_PORT:-8080}/healthz'',r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 6
  manager:
    profiles: [management]
    build:
      context: ..
      dockerfile: apps/manager/deploy/docker/Dockerfile
    image: cherynyxus-manager:local
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=64m"]
    security_opt: ["no-new-privileges:true"]
    environment:
      CHERY_DIR: /app/platform/qqbot
      CHERY_MANAGER_HOST: ${NYXUS_MANAGER_BIND:-0.0.0.0}
      CHERY_MANAGER_PORT: ${NYXUS_MANAGER_PORT:-39980}
      CHERY_MANAGER_BACKEND_MODE: external

      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
    volumes:
      - ${QQBOT_DATA_DIR:-./qqbot-data}/.chery:/app/platform/qqbot/.chery
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'node -e "require(''http'').get({hostname:''127.0.0.1'',port:${NYXUS_MANAGER_PORT:-39980},path:''/'',headers:{Host:''10.2.3.6:${NYXUS_MANAGER_PORT:-39980}''}},r=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  backend: {}

secrets:
  chery_auth_session_secret:
    file: ${CHERY_AUTH_SESSION_SECRET_FILE:-./secrets/chery_auth_session_secret}
  qqbot_platform_token:
    file: ${QQBOT_PLATFORM_TOKEN_FILE:-./secrets/qqbot_platform_token}
  qqbot_model_key:
    file: ${QQBOT_MODEL_KEY_FILE:-./secrets/qqbot_model_key}
