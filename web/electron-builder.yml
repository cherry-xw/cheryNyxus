appId: com.cherynyxus.app
productName: CheryNyxus
directories:
  output: release
  buildResources: build

# Electron main process and renderer output under web/.
files:
  - dist/**
  - dist-electron/**

# koffi and its platform packages contain native binaries and cannot load from asar.
asarUnpack:
  - "**/node_modules/koffi/**"
  - "**/node_modules/@koromix/**"

# The backend, immutable workspace seeds and bundled Node runtime live under resources/.
# Runtime `.env` and `.chery/` are deliberately not materialized in appOutDir: the app creates or
# upgrades them on startup, preventing installer upgrades from overwriting user-owned files.
extraResources:
  - from: ../dist
    to: dist
  - from: ../.env.example
    to: .env.example
  - from: ../.chery.template
    to: .chery.template
  # Path is relative to the web/ package root, so ../build/node resolves to <repo>/build/node.
  - from: ../build/node
    to: node

# The backend runs with the bundled/system Node ABI rather than Electron's embedded Node ABI.
npmRebuild: true
buildDependenciesFromSource: true

# Verify immutable seeds and remove stale runtime copies left by older build hooks.
afterPack: ./scripts/post-pack.mjs

win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: AppImage
  category: Development
