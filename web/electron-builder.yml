appId: com.cherynyxus.app
productName: CheryNyxus
directories:
  output: release
  buildResources: build

# Electron main process and renderer output under web/.
files:
  - dist/**
  - dist-electron/**

# koffi and its platform packages contain native binaries and cannot load from asar.
asarUnpack:
  - "**/node_modules/koffi/**"
  - "**/node_modules/@koromix/**"

# Electron is a frontend shell. Backend, Node runtime, and `.chery` templates
# are provided by the independent backend/manager distribution.

win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: AppImage
  category: Development
