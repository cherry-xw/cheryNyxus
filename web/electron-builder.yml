# electron-builder 配置
# 详见 docs/web/electron.md 扩展点 + docs/web/deployment.md 模式 2

appId: com.cheryclaw.app
productName: cheryClaw
directories:
  output: release
  buildResources: build

# 主进程 + 渲染产物（web/ 内）
files:
  - dist/**
  - dist-electron/**

# 后端 bundle + .chery 配置（随应用分发，只读）
# main 进程 spawn 后端时 CHERY_DIR = resources/，DB_DIR = userData（可写）
extraResources:
  - from: ../dist
    to: dist
  - from: ../.chery
    to: .chery
    filter:
      - config.yaml
      - system.md
      - prompts/**
      - skills/**
      - senses/**

# 后端由系统 node / 打包 node 二进制运行，不走 Electron ABI。
# npmRebuild 仅影响 web 包依赖；root better-sqlite3 需匹配随发行版携带的 node ABI。
npmRebuild: true
buildDependenciesFromSource: true

win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.developer-tools
linux:
  target: AppImage
  category: Development
