global:
  thinking: true
  supervision: manual
  stream: true
  sense_execute_timeout: 10000
  approval_timeout: 30000
  bash_log_retention_hours: 24
  textEditor: notepad
  file_compression:
    truncate_threshold: 50000
    truncate_preview_lines: 100
    log_file_extensions:
      - .log
      - .txt
      - .out
      - .err
    drain_preview_count: 3
  logger:
    level: info
    output:
      - file
    timestamp: true
    location: true
    format: plain
llm:
  brain:
    zai-glm-5.2:
      url: https://yz.xcherry.top:11411/v1
      model: glm-5.2
      key: $API_KEY
      thinking: high
      provider: openai
      contextLimit: 1024000
      capabilities:
        input:
          image: true
        generate: {}
    longcat:
      url: https://api.longcat.chat/openai
      model: LongCat-Flash-Thinking-2601
      thinking: 'off'
      provider: openai
      contextLimit: 32768
      capabilities:
        input: {}
        generate: {}
    doubao:
      url: http://yz.xcherry.top:11411/v1
      model: doubao2.0-pro
      key: $API_KEY
      thinking: high
      provider: openai
      contextLimit: 128000
      capabilities:
        input: {}
        generate: {}
    ali_glm5:
      url: https://yz.xcherry.top:11411/v1
      model: glm-5
      key: $API_KEY
      thinking: high
      provider: openai
      contextLimit: 128000
      capabilities:
        input:
          image: true
        generate: {}
    shangtang:
      url: https://yz.xcherry.top:11411/v1
      model: csensenova-6.7-flash-lite
      key: $API_KEY
      thinking: 'off'
      provider: openai
      rpm: 2
      contextLimit: 128000
      capabilities:
        input: {}
        generate: {}
    mock_test:
      model: mock_test
      thinking: 'off'
      provider: mock
      mock:
        enabled: true
        file: mock/read_file.yaml
      contextLimit: 8192
      capabilities:
        input: {}
        generate: {}
media: {}
sense_groups:
  leader:
    - read_file
    - skill
    - write_file
    - execute_command
    - search_codebase
    - spawn_role
  plan:
    - spawn_role
    - update_todo
    - skill
    - read_file
    - write_file
    - execute_command
  coder:
    - execute_command
    - write_file
    - read_file
    - skill
    - search_codebase
  reviewer:
    - read_file
    - search_codebase
    - skill
roles:
  coordinator:
    brain: ali_glm5
    senseGroup: leader
    mcpServers: []
    systemPrompt: prompts/prefebMain/leader.md
  plan:
    brain: ali_glm5
    senseGroup: plan
    mcpServers: []
    systemPrompt: prompts/prefebMain/planner.md
  coder:
    brain: ali_glm5
    senseGroup: coder
    mcpServers: []
    systemPrompt: prompts/prefebMain/coder.md
  reviewer:
    brain: ali_glm5
    senseGroup: reviewer
    mcpServers: []
    systemPrompt: prompts/prefebMain/reviewer.md
presets:
  默认:
    leader: coordinator
    roles:
      - plan
      - coder
      - coordinator
      - reviewer
    workspace: /home/chery/dev/chery-spider
server:
  port: 8182
  transport: binary
  host: 127.0.0.1
memory:
  max_count: 15
  max_chars: 500
