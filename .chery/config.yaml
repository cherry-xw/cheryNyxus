global:
  thinking: true
  supervision: manual
  stream: true
  sense_execute_timeout: 10000
  approval_timeout: 30000
  bash_log_retention_hours: 24
  file_compression:
    truncate_threshold: 50000
    truncate_preview_lines: 100
    log_file_extensions:
      - .log
      - .txt
      - .out
      - .err
    drain_preview_count: 3
  logger:
    level: info
    output:
      - file
    timestamp: true
    location: true
    format: plain
llm:
  brain:
    zai-glm-5.2:
      url: https://yz.xcherry.top:11411/v1
      model: glm-5.2
      key: $SHANG_TANG_API_KE
      thinking: true
      provider: openai
      contextLimit: 1024000
    openai:
      url: https://api.openai.com/v1
      model: gpt-3.5-turbo
      key: $OPENAI_API_KEY
      provider: openai
      contextLimit: 16385
    longcat:
      url: https://api.longcat.chat/openai
      model: LongCat-Flash-Thinking-2601
      key: $LONGCAT_API_KEY
      thinking: true
      provider: openai
      contextLimit: 32768
    deepseek:
      url: https://api.deepseek.com
      model: deepseek-v4-flash
      key: $DEEPSEEK_API_KEY
      thinking: true
      provider: openai
      contextLimit: 64000
    doubao:
      url: http://yz.xcherry.top:11411/v1
      model: doubao2.0-pro
      key: $DOUBAO_API_KEY
      thinking: true
      provider: openai
      contextLimit: 128000
    ali_glm5:
      url: https://coding.dashscope.aliyuncs.com/v1
      model: glm-5
      key: $ALI_API_KEY
      thinking: true
      provider: openai
      contextLimit: 128000
    shangtang:
      url: https://yz.xcherry.top:11411/v1
      model: cglm-5.2
      key: $SHANG_TANG_API_KE
      provider: openai
      rpm: 2
      contextLimit: 32768
    mock_test:
      model: mock_test
      provider: mock
      mock:
        enabled: true
        file: mock/read_file.yaml
      contextLimit: 8192
sense_groups:
  all_senses:
    - read_file
    - skill
    - write_file
    - execute_command
    - search_codebase
    - spawn_subagent
    - update_todo
  safe_senses:
    - read_file
    - skill
    - search_codebase
  dangerous_senses:
    - execute_command
    - write_file
  custom_senses:
    - echo_text
default:
  brain: ali_glm5
  senseGroups:
    - all_senses
  mcpServers: []
subagents:
  read_code:
    brain: ali_glm5
    senseGroups:
      - safe_senses
  read_image:
    brain: ali_glm5
    senseGroups:
      - safe_senses
  web_search:
    brain: ali_glm5
    senseGroups:
      - safe_senses
server:
  port: 8182
  transport: binary
