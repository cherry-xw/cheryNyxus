# test/flows 集成测试专用配置（CHERY_DIR = test/flows/fixtures）
# 多 mock brain 覆盖各交互流程，provider 全为 mock（离线、无网络）
llm:
  brain:
    mock_content:                # 流程A：单轮纯 content
      model: mock_content
      provider: mock
      mock:
        enabled: true
        file: mock/content_only.yaml
    mock_auto:                   # 流程B：auto sense 两轮
      model: mock_auto
      provider: mock
      mock:
        enabled: true
        file: mock/auto_sense.yaml
    mock_confirm:                # 流程C：confirm sense（accept / reject 由 client 控制）
      model: mock_confirm
      provider: mock
      mock:
        enabled: true
        file: mock/confirm_sense.yaml
    mock_confirm_reject:         # 流程C-reject 独立脚本（id 隔离避免跨 chat 冲突）
      model: mock_confirm_reject
      provider: mock
      mock:
        enabled: true
        file: mock/confirm_reject.yaml
    mock_recover_2:              # 恢复流程：resume Case1（id recover-wf-2）
      model: mock_recover_2
      provider: mock
      mock:
        enabled: true
        file: mock/recover_2.yaml
    mock_recover_3:              # 恢复流程：send staged.reverse（id recover-wf-3）
      model: mock_recover_3
      provider: mock
      mock:
        enabled: true
        file: mock/recover_3.yaml
    mock_multiloop:              # 多轮 sense 链（loop）
      model: mock_multiloop
      provider: mock
      mock:
        enabled: true
        file: mock/multiloop.yaml
    mock_userloop:               # user in loop 测试（confirm 窗口给第二条 send 入队）
      model: mock_userloop
      provider: mock
      mock:
        enabled: true
        file: mock/userloop.yaml
    mock_todo:                   # 流程S7：todo list（update_todo:auto 自动执行）
      model: mock_todo
      provider: mock
      mock:
        enabled: true
        file: mock/todo_flow.yaml
    mock_flow_stream:            # 流程S8：流式中断刷新续跑（chunkDelayMs=2000 造断连窗口）
      model: mock_flow_stream
      provider: mock
      mock:
        enabled: true
        file: mock/flow_stream.yaml
    mock_spawn:                  # 流程S14：父派发 spawn_role(immediate)，子完成唤主后续跑
      model: mock_spawn
      provider: mock
      mock:
        enabled: true
        file: mock/spawn_immediate.yaml
    mock_spawn_deferred:         # 流程S15：父一轮派发 2 个 spawn_role(deferred)，验静默批量唤主
      model: mock_spawn_deferred
      provider: mock
      mock:
        enabled: true
        file: mock/spawn_deferred.yaml
    mock_spawn_stream:          # 流程S16：父派发 spawn_role(reviewer_stream)，子流式造刷新重连窗口
      model: mock_spawn_stream
      provider: mock
      mock:
        enabled: true
        file: mock/spawn_stream.yaml
    mock_child_stream:           # 流程S16：子 agent 流式（chunkDelayMs=2000 造刷新重连窗口）
      model: mock_child_stream
      provider: mock
      mock:
        enabled: true
        file: mock/child_stream.yaml

# sense 分组（:level 后缀覆盖监管等级）
sense_groups:
  auto_senses:                   # read_file 自动执行
    - read_file:auto
  confirm_senses:                # write_file 需审批
    - write_file:smart
  mixed_confirm:                 # 多感官 confirm
    - read_file:smart
    - write_file:smart
  todo_senses:                   # update_todo 自动执行（todo 显示）
    - update_todo:auto
  spawn_senses:                  # spawn_role 派发（父 agent 用；权限策略要求 smart 审批）
    - spawn_role:smart
  detail_diagnostics:
    - read_file
    - search_codebase
    - execute_command

# 角色定义（spawn_role type 单一源；子 brain 决定子 agent 行为）
roles:
  reviewer:                      # S14/S15 子：mock_content 纯 content 即完成
    brain: mock_content
    senseGroup: auto_senses
    permissions:
      template: trusted
  reviewer_stream:               # S16 子：流式慢响应，造刷新重连窗口
    brain: mock_child_stream
    senseGroup: auto_senses
  explanation:
    brain: mock_content
    senseGroup: detail_diagnostics
    mcpServers: []

presets:
  detail-test:
    leader: reviewer
    roles: [reviewer, explanation]
    detailRole: explanation

global:
  thinking: true
  supervision: manual            # 全局默认 manual（被 sense_groups :level 覆盖）
  stream: true
  sense_execute_timeout: 10000
  logger:
    level: warn                  # 测试降噪
    output: [console]
