# 流程C：confirm sense 两轮（write_file:confirm，需审批）
# accept / reject 由 client 控制，脚本只决定 LLM 响应
repeat: last
script:
  - thinking: "需要写文件，请求审批"
    content: "准备写文件"
    senseCalls:
      - id: "confirm-wf-0"
        name: "write_file"
        arguments: '{"path":"/tmp/cheryclaw-mock-test.txt","content":"hello"}'
  - content: "文件已处理完毕"
