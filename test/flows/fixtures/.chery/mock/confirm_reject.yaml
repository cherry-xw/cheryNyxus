# 流程C-reject：confirm sense（write_file:confirm）独立脚本
# id 与 confirm_sense.yaml 不同，避免同月份 messages 表跨 chat PRIMARY KEY 冲突
repeat: last
script:
  - thinking: "需要写文件，请求审批"
    content: "准备写文件"
    senseCalls:
      - id: "confirm-wf-reject-0"
        name: "write_file"
        arguments: '{"path":"/tmp/cheryclaw-mock-reject.txt","content":"hello"}'
  - content: "文件已处理完毕"
